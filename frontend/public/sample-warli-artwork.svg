      <g transform="rotate(180) translate(0, -145)"><circle cx="0" cy="-18" r="5.5" fill="#FBF4E4"/><polygon points="0,-14 -9,-3 9,-3" fill="#FBF4E4"/><polygon points="0,8 -9,-3 9,-3" fill="#FBF4E4"/><line x1="0" y1="8" x2="-7" y2="24" stroke="#FBF4E4" stroke-width="2.2"/><line x1="0" y1="8" x2="7" y2="24" stroke="#FBF4E4" stroke-width="2.2"/></g>
      <g transform="rotate(225) translate(0, -145)"><circle cx="0" cy="-18" r="5.5" fill="#FBF4E4"/><polygon points="0,-14 -9,-3 9,-3" fill="#FBF4E4"/><polygon points="0,8 -9,-3 9,-3" fill="#FBF4E4"/><line x1="0" y1="8" x2="-7" y2="24" stroke="#FBF4E4" stroke-width="2.2"/><line x1="0" y1="8" x2="7" y2="24" stroke="#FBF4E4" stroke-width="2.2"/></g>
      <g transform="rotate(270) translate(0, -145)"><circle cx="0" cy="-18" r="5.5" fill="#FBF4E4"/><polygon points="0,-14 -9,-3 9,-3" fill="#FBF4E4"/><polygon points="0,8 -9,-3 9,-3" fill="#FBF4E4"/><line x1="0" y1="8" x2="-7" y2="24" stroke="#FBF4E4" stroke-width="2.2"/><line x1="0" y1="8" x2="7" y2="24" stroke="#FBF4E4" stroke-width="2.2"/></g>
      <g transform="rotate(315) translate(0, -145)"><circle cx="0" cy="-18" r="5.5" fill="#FBF4E4"/><polygon points="0,-14 -9,-3 9,-3" fill="#FBF4E4"/><polygon points="0,8 -9,-3 9,-3" fill="#FBF4E4"/><line x1="0" y1="8" x2="-7" y2="24" stroke="#FBF4E4" stroke-width="2.2"/><line x1="0" y1="8" x2="7" y2="24" stroke="#FBF4E4" stroke-width="2.2"/></g>
    </g>
