  <!-- 4. HARVEST & VILLAGE LIFE -->
  <g id="bullock-cart" transform="translate(880, 680)">
    <g transform="translate(-80, 0)">
      <polygon points="0,0 25,-12 25,12" fill="#FBF4E4"/>
      <polygon points="50,0 25,-12 25,12" fill="#FBF4E4"/>
      <polygon points="50,0 65,-8 60,6" fill="#FBF4E4"/>
      <path d="M 60,-8 Q 70,-25 60,-35" stroke="#FBF4E4" stroke-width="3" fill="none"/>
      <line x1="10" y1="10" x2="8" y2="35" stroke="#FBF4E4" stroke-width="2.5"/>
      <line x1="18" y1="10" x2="16" y2="35" stroke="#FBF4E4" stroke-width="2.5"/>
      <line x1="40" y1="10" x2="38" y2="35" stroke="#FBF4E4" stroke-width="2.5"/>
      <line x1="48" y1="10" x2="46" y2="35" stroke="#FBF4E4" stroke-width="2.5"/>
    </g>
    <circle cx="-10" cy="20" r="32" stroke="#FBF4E4" stroke-width="4" fill="none"/>
    <circle cx="-10" cy="20" r="6" fill="#FBF4E4"/>
    <line x1="-42" y1="20" x2="22" y2="20" stroke="#FBF4E4" stroke-width="2"/>
    <line x1="-10" y1="-12" x2="-10" y2="52" stroke="#FBF4E4" stroke-width="2"/>
  </g>
