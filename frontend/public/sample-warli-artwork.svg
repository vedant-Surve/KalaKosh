        <polygon points="0,-14 -8,-3 8,-3" fill="#FBF4E4"/>
        <polygon points="0,8 -8,-3 8,-3" fill="#FBF4E4"/>
        <line x1="0" y1="8" x2="-6" y2="22" stroke="#FBF4E4" stroke-width="2"/>
        <line x1="0" y1="8" x2="6" y2="22" stroke="#FBF4E4" stroke-width="2"/>
