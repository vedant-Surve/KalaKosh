      <line x1="0" y1="6" x2="-8" y2="24" stroke="#FBF4E4" stroke-width="2.5"/>
      <line x1="0" y1="6" x2="8" y2="24" stroke="#FBF4E4" stroke-width="2.5"/>
      <path d="M -4,-14 Q -25,-30 -45,-40" stroke="#FBF4E4" stroke-width="4" fill="none"/>
      <polygon points="-45,-40 -58,-52 -40,-50" fill="#FBF4E4"/>
